<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08050f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Chirimbolandia · Turno de noche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08050f;--bg2:#1a0f33;--panel:#161026;--panel2:#241a3d;--ink:#efe9ff;--soft:#a99fc9;--edge:#000;
  --red:#ff3b3b;--amber:#ffb020;--green:#3dff8a;--purple:#8a5cff;--blue:#3aa0ff;--eye:#ffe14a;--good:#2fb45d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08050f;--bg2:#1a0f33;--panel:#161026;--panel2:#241a3d;--ink:#efe9ff;--soft:#a99fc9;}}
:root[data-theme="dark"]{--bg:#08050f;--bg2:#1a0f33;--panel:#161026;--panel2:#241a3d;--ink:#efe9ff;--soft:#a99fc9;}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);background-attachment:fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
#app{max-width:760px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom));min-height:100vh}
h1,h2,h3,p{margin:0}
.px{font-family:'Press Start 2P',ui-monospace,'Courier New',monospace;letter-spacing:.5px}
.center{text-align:center}
.btn{font:inherit;font-weight:900;font-size:1.1rem;color:#fff;background:var(--purple);border:3px solid #000;border-radius:10px;padding:12px 16px;box-shadow:0 5px 0 #000,0 0 14px rgba(138,92,255,.35);cursor:pointer;transition:transform .05s,box-shadow .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.red{background:#c92a2a}.btn.green{background:var(--good)}.btn.blue{background:#2478d6}.btn.amber{background:var(--amber);color:#1a0f33}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.big{font-size:1.3rem;padding:16px 24px}
.btn.small{font-size:.9rem;padding:8px 12px;box-shadow:0 4px 0 #000}
.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.card{background:var(--panel);border:3px solid #000;border-radius:12px;box-shadow:0 5px 0 #000,0 0 0 2px var(--panel2);padding:14px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.ttl{font-size:.62rem;text-align:center;flex:1;line-height:1.5}
.chip{background:var(--panel2);border:3px solid #000;border-radius:999px;padding:4px 10px;white-space:nowrap}
@keyframes flicker{0%,100%{opacity:1}90%{opacity:1}91%{opacity:.35}92%{opacity:1}95%{opacity:.6}96%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(255,59,59,.3)}50%{box-shadow:0 0 26px rgba(255,59,59,.9)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes zoom{0%{transform:scale(.4)}60%{transform:scale(1.25) rotate(-3deg)}100%{transform:scale(1.1) rotate(2deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes noise{0%{background-position:0 0}100%{background-position:0 6px}}
/* título */
.title{text-align:center;min-height:90vh;padding-top:8vh;position:relative;overflow:hidden}
.moon{font-size:4rem;animation:float 5s ease-in-out infinite}
.logo{font-family:'Creepster','Press Start 2P',cursive;font-size:clamp(2.6rem,15vw,5rem);line-height:1;color:var(--red);text-shadow:0 0 18px rgba(255,59,59,.7),3px 3px 0 #000;animation:flicker 5s infinite;margin:18px 0 6px;letter-spacing:2px}
.sub{color:var(--soft);font-size:1.15rem;margin-bottom:26px}
.eyes{position:absolute;bottom:14vh;left:0;right:0;display:flex;justify-content:space-around;font-size:1.3rem;opacity:.85}
.eyes span{animation:blink 6s infinite}.eyes span:nth-child(2n){animation-delay:2s}.eyes span:nth-child(3n){animation-delay:4s}
/* noches */
.night-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:3px solid #000;border-radius:12px;box-shadow:0 5px 0 #000;padding:12px;margin-bottom:12px;cursor:pointer}
.night-card:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.night-card.lock{opacity:.45;filter:grayscale(.8)}
.ni{font-size:2.2rem;width:62px;height:62px;display:grid;place-items:center;border-radius:10px;border:3px solid #000;background:var(--panel2);flex:none}
.nt{font-size:1.15rem;font-weight:900}.ns{font-size:.9rem;color:var(--soft);margin-top:2px}
.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
/* diálogo/cinta */
.overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px calc(16px + env(safe-area-inset-bottom));background-color:var(--bg);background-image:linear-gradient(180deg,var(--ov1,#1a0f33),var(--ov2,#08050f))}
.tapetag{align-self:center;background:var(--panel2);border:3px solid #000;border-radius:8px;padding:6px 12px;font-size:.6rem;animation:flicker 4s infinite}
.scene{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:clamp(2.6rem,13vw,5rem)}
.scene span{animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(138,92,255,.6))}.scene span:nth-child(2n){animation-delay:.8s}
.dlgrow{display:flex;gap:10px;align-items:flex-start;max-width:760px;width:100%;margin:0 auto}
.portrait{font-size:3rem;background:var(--panel2);border:3px solid #000;border-radius:12px;width:78px;height:96px;display:grid;place-items:center;flex:none}
.portrait.evil{background:#4a1220;box-shadow:0 0 16px rgba(255,59,59,.6)}
.bubble{flex:1;background:var(--panel);border:3px solid #000;border-radius:12px;padding:12px 14px;font-size:1.15rem;line-height:1.4;min-height:130px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 0 0 2px var(--panel2)}
.who{font-size:.6rem;color:var(--amber)}
.dfoot{display:flex;gap:8px;align-items:center;justify-content:space-between}
.more{font-size:.82rem;color:var(--soft)}
/* noche */
.nhud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.clk{font-size:1.1rem}
.pw{display:flex;align-items:center;gap:6px;font-size:.95rem}
.pwbar{width:70px;height:12px;border:2px solid #000;border-radius:6px;background:#0d0818;overflow:hidden}
.pwbar i{display:block;height:100%;width:100%;background:var(--green);transition:width .3s,background .3s}
.office{display:grid;grid-template-columns:1fr 1fr;gap:10px;transition:filter .5s}
.office.dark{filter:brightness(.25) sepia(1) hue-rotate(300deg)}
.door{background:linear-gradient(#050309,#140b24);border:3px solid #000;border-radius:10px;padding:8px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;position:relative;overflow:hidden}
.door.threat{animation:pulse 1s infinite}
.dlabel{font-size:.5rem;color:var(--soft)}
.hall{flex:1;width:100%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 100%,rgba(255,225,120,.09),transparent 65%);border-radius:8px;min-height:90px}
.silw{position:relative;display:inline-block;animation:flicker 2s infinite}
.sil{font-size:4.2rem;line-height:1;display:block;filter:brightness(0) drop-shadow(0 0 1px #000)}
.eye{position:absolute;top:34%;width:8px;height:8px;border-radius:50%;background:var(--eye);box-shadow:0 0 10px 3px var(--eye)}
.eye.l{left:30%}.eye.r{right:30%}
.tbar{width:100%;height:10px;border:2px solid #000;border-radius:6px;background:#0d0818;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--amber))}
.flash{width:100%}
.deskrow{display:flex;gap:10px;align-items:center;margin:10px 0}
.cubib{font-size:2.4rem;background:var(--panel2);border:3px solid #000;border-radius:12px;width:64px;height:64px;cursor:pointer;flex:none}
.alert{flex:1;min-height:64px;background:var(--panel);border:3px solid #000;border-radius:10px;padding:8px 10px;font-size:1rem;line-height:1.3;display:flex;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* cámaras */
.monitor{background:#03180d;border:4px solid #0c3a20;border-radius:10px;padding:10px;color:var(--green);font-family:'Press Start 2P',monospace;position:relative;overflow:hidden}
.monitor::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);animation:noise .4s linear infinite}
.mhead{display:flex;justify-content:space-between;font-size:.55rem;margin-bottom:8px}
.rec{color:var(--red);animation:blink 1s infinite}
.mroom{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:.6rem;line-height:1.6}
.mroom .big{font-size:2.6rem}
.cs{font-size:3.4rem;line-height:1;filter:grayscale(1) sepia(1) hue-rotate(75deg) saturate(3) drop-shadow(0 0 8px var(--green))}
.camlist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.camb{font-family:'Press Start 2P',monospace;font-size:.6rem;padding:10px 0;background:#052a16;color:var(--green);border:3px solid #0c3a20;border-radius:8px;cursor:pointer}
.camb.on{background:var(--green);color:#03180d}
.warn{background:#5a1010;color:#fff;border:3px solid var(--red);border-radius:8px;padding:8px;margin-bottom:8px;font-size:.95rem;text-align:center;animation:pulse 1s infinite}
/* pregunta */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:38}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:40;background:var(--panel);border-top:4px solid var(--purple);box-shadow:0 -10px 30px rgba(0,0,0,.7);padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
.sheet-in{max-width:760px;margin:0 auto}
.sheethead{font-size:.6rem;color:var(--amber);margin-bottom:8px;line-height:1.5}
.pwrap{height:12px;border:2px solid #000;border-radius:6px;background:#0d0818;overflow:hidden;margin-bottom:8px}
.pwrap i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--amber))}
.prompt{font-size:1.1rem;line-height:1.4;margin-bottom:10px}
.qbig{font-size:clamp(1.3rem,7vw,2rem);text-align:center;margin:8px 0 12px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.answers.three{grid-template-columns:repeat(3,1fr)}
.opt{font-size:1.4rem;padding:16px 6px;background:var(--purple);color:#fff;border:3px solid #000;border-radius:10px;box-shadow:0 5px 0 #000;cursor:pointer}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.opt.wrong{background:#555;opacity:.4;text-decoration:line-through}
.opt.right{background:var(--good);animation:pop .4s}
.kdisp{font-size:1.8rem;text-align:center;background:#0d0818;border:3px solid #000;border-radius:10px;padding:10px;margin-bottom:10px;min-height:64px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-size:1.3rem;padding:12px 0;background:var(--panel2);color:var(--ink);border:3px solid #000;border-radius:10px;box-shadow:0 4px 0 #000;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.key.go{background:var(--good);color:#fff}
.hint{background:#3b3210;color:#ffe9a6;border:3px solid #000;border-radius:10px;padding:10px;margin:10px 0;font-size:1.02rem;line-height:1.4}
.fb{text-align:center;min-height:1.4em;font-size:1.1rem;margin:8px 0}
.fb.good{color:var(--green)}.fb.meh{color:var(--amber)}
.disc{background:#3b3210;color:#ffe9a6;border:3px solid #000;border-radius:10px;padding:8px;margin-top:8px;font-size:.92rem;animation:pop .4s}
.cb-row{text-align:center;margin-top:10px}
.vis{display:flex;justify-content:center;margin:6px 0}
.arr{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.acol{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 3px;border:3px solid transparent;border-radius:8px;transition:.3s}
.acol.lit{border-color:var(--amber);background:rgba(255,176,32,.2)}
.it{font-size:1.2rem;line-height:1.1}
.lab{font-size:.65rem;min-height:1.1em;font-family:'Press Start 2P',monospace}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-bottom:8px}
.friends{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.friend{text-align:center;border:3px dashed var(--soft);border-radius:10px;padding:6px;min-width:70px}
.friend .fa{font-size:1.8rem}.bagc{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;min-height:28px;font-size:1.05rem}
.cnt{font-family:'Press Start 2P',monospace;font-size:.7rem}
/* susto */
.scare{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.scare .face{font-size:min(60vmin,18rem);line-height:1;animation:zoom .5s ease-out forwards}
.scare .redflash{position:absolute;inset:0;background:var(--red);opacity:.0;animation:rf .5s ease-out}
@keyframes rf{0%{opacity:.85}100%{opacity:0}}
.scare .box{position:relative;background:var(--panel);border:3px solid #000;border-radius:12px;padding:18px;max-width:440px;animation:pop .4s}
.big{font-size:3.6rem}
/* muro y ajustes */
.pyth{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;font-size:clamp(.5rem,2.6vw,.85rem)}
.pc{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;border:2px solid #000;background:var(--panel2);cursor:pointer;padding:0;font:inherit;color:var(--ink)}
.pc.h{background:#000;color:var(--soft)}.pc.u{opacity:.25}
.pc.b0{background:#ffb457;color:#241a45}.pc.b1{background:#b9e6ff;color:#241a45}.pc.b2{background:#9be27f;color:#241a45}.pc.b3{background:#ffd54a;color:#241a45}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.85rem}
.legend span{display:inline-flex;gap:4px;align-items:center}.legend i{width:14px;height:14px;border-radius:3px;border:2px solid #000;display:inline-block}
.hatrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--panel2)}
h2.sec{font-size:.65rem;margin:14px 0 6px;color:var(--amber)}
.seg{display:flex;gap:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#000;color:#fff;border:2px solid var(--purple);padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:120;font-size:1rem;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.pop{animation:pop .4s}
.night-card .ns{line-height:1.3}
@media (prefers-reduced-motion:reduce){.logo,.moon,.silw,.tapetag,.scene span,.eyes span,.door.threat,.rec,.monitor::after{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const $=(s,e)=>(e||document).querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  return el;
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2300);}
function confetti(n){n=n||40;const em=['✨','⭐','🌅','☀️','⚙️','💛'];for(let i=0;i<n;i++){const s=h('span',{class:'conf',style:`left:${Math.random()*100}vw;animation-delay:${Math.random()*1.5}s;animation-duration:${2.5+Math.random()*2}s;font-size:${18+Math.random()*18}px`},pick(em));document.body.append(s);setTimeout(()=>s.remove(),6500);}}

/* ================= estado ================= */
const KEY='chirimbolandia_v1';
const DEF=()=>({name:'',gears:0,nights:{},fails:{},tapes:[],tips:{},basement:false,facts:{},disc:{},settings:{sound:true,scare:'normal',diff:'normal',read:false,forceOpts:false}});
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){const d=DEF();return Object.assign(d,r,{settings:Object.assign(d.settings,r.settings||{})});}}catch(e){}
  return DEF();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const fkey=(a,b)=>a<=b?`${a}x${b}`:`${b}x${a}`;
function recordFact(a,b,ok){
  const k=fkey(a,b);const f=S.facts[k]||(S.facts[k]={box:0,ok:0,bad:0});
  if(ok){f.ok++;f.box=Math.min(3,f.box+1);}else{f.bad++;f.box=0;}save();
}
function factWeight(t,k,main){
  const f=S.facts[fkey(t,k)];let w=main?3:1;
  if(!f||f.ok+f.bad===0)w*=2;else if(f.box===0)w*=4;else if(f.box===1)w*=2.5;else if(f.box===2)w*=1.5;
  return w;
}
function wpick(items){const tot=items.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;for(const x of items){r-=x.w;if(r<=0)return x;}return items[0];}

/* ================= sonido ================= */
let AC=null,AMB=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,type,vol,delay){
  if(!S.settings.sound)return;
  try{const A=ac(),t=A.currentTime+(delay||0),o=A.createOscillator(),g=A.createGain();
    o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));
    o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+(d||.12)+.02);}catch(e){}
}
function noise(dur,vol){
  if(!S.settings.sound)return;
  try{const A=ac(),n=Math.floor(A.sampleRate*dur),b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=A.createBufferSource(),g=A.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(A.destination);s.start();}catch(e){}
}
const sfx={
  ok(){[523,659,784].forEach((f,i)=>beep(f,.12,'square',.05,i*.08));},
  bad(){beep(196,.2,'sawtooth',.04);beep(147,.25,'sawtooth',.04,.1);},
  pop(){beep(700,.06,'square',.03);},
  step(){beep(70,.12,'sine',.12);beep(60,.12,'sine',.1,.35);},
  thump(){beep(60,.14,'sine',.16);beep(52,.16,'sine',.14,.18);},
  zap(){noise(.25,.08);beep(900,.2,'sawtooth',.04);},
  chime(){[784,988].forEach((f,i)=>beep(f,.5,'triangle',.05,i*.25));},
  box(){[659,622,659,622,659,494,587,523,440].forEach((f,i)=>beep(f,.4,'triangle',.05,i*.4));},
  scare(){noise(.7,.2);beep(90,.6,'sawtooth',.12);beep(1200,.4,'square',.05,.05);},

const ITEMS=[
  {e:'🔩',s:'tornillo',p:'tornillos',g:'m'},{e:'⚙️',s:'engranaje',p:'engranajes',g:'m'},{e:'🔋',s:'pila',p:'pilas',g:'f'},
  {e:'🎈',s:'globo',p:'globos',g:'m'},{e:'🍕',s:'porción',p:'porciones',g:'f'},{e:'🔑',s:'llave',p:'llaves',g:'f'},
  {e:'🕯️',s:'vela',p:'velas',g:'f'},{e:'🎟️',s:'entrada',p:'entradas',g:'f'}
];
const nItem=(it,n)=>n===1?it.s:it.p;
function optsChoice(ans,near,count){
  const s=new Set([ans]);
  for(const x of shuffle(near)){if(s.size>=count)break;if(x>0&&x!==ans&&Number.isInteger(x))s.add(x);}
  let g=0;while(s.size<count&&g++<60){const x=ans+rnd(-4,4);if(x>0&&x!==ans)s.add(x);}
  return shuffle([...s]);
}
function hintMul(t,k){
  if(t===2)return `La tabla del 2 es el doble. Pensá: ${k} + ${k}.`;
  if(t===3)return `La tabla del 3 es el doble y uno más. Pensá: el doble de ${k}, y sumale ${k} otra vez.`;
  if(t===4)return `La tabla del 4 es el doble del doble. Pensá: el doble de ${k}, y después el doble de ese número.`;
  return `Contá de a ${t}, ${k} veces.`;
}
function revealMul(t,k,a,b){
  const p=t*k,list=Array.from({length:k},(_,i)=>t*(i+1)).join(', ');let how;
  if(t===2)how=`${k} + ${k} = ${p}`;else if(t===3)how=`${k} + ${k} + ${k} = ${p}`;
  else if(t===4)how=`el doble de ${k} es ${2*k}, y el doble de ${2*k} es ${p}`;else how=`contando de a ${t}: ${list}`;
  return `${t} × ${k} = ${p}. (${how})`+(a!==t?` ¡Y ${a} × ${b} da lo mismo!`:'');
}
function mulQ(t,k){
  const it=pick(ITEMS),flip=Math.random()<.5&&t!==k,a=flip?k:t,b=flip?t:k,ans=t*k;
  return {kind:'mul',t,k,ans,fact:[t,k],text:`${a} × ${b} = ?`,a,b,near:[ans-t,ans+t,ans-k,ans+k,t+k,ans+1,ans-1],
    vis:{type:'array',groups:k,per:t,item:it.e},hint1:hintMul(t,k),reveal:revealMul(t,k,a,b)};
}
function divQ(d,k){
  const total=d*k,it=pick(ITEMS);
  return {kind:'div',t:d,k,ans:k,fact:[d,k],text:`${total} ÷ ${d} = ?`,near:[k+1,k-1,k+2,d,total-d,Math.floor(total/2)],
    vis:{type:'groups',total,per:d,item:it.e},
    hint1:`Pensá: ¿qué número multiplicado por ${d} da ${total}? Ayudate con la tabla del ${d}.`,
    reveal:`${d} × ${k} = ${total}, entonces ${total} ÷ ${d} = ${k}. (Entran ${k} grupos de ${d})`};
}
function missQ(t,k){
  const total=t*k,it=pick(ITEMS),flip=Math.random()<.5;
  return {kind:'miss',t,k,ans:k,fact:[t,k],text:flip?`? × ${t} = ${total}`:`${t} × ? = ${total}`,near:[k+1,k-1,k+2,t,total-t],
    vis:{type:'groups',total,per:t,item:it.e},hint1:`Buscá en la tabla del ${t}: ¿qué número da ${total}?`,reveal:`${t} × ${k} = ${total}. ¡El número que falta es ${k}!`};
}
const build=(kind,t,k)=>kind==='div'?divQ(t,k):kind==='miss'?missQ(t,k):mulQ(t,k);
function qFor(tables,divProb,tMain){
  const t=(tMain&&Math.random()<.7)?tMain:pick(tables);
  const k=wpick(Array.from({length:10},(_,i)=>({k:i+1,w:factWeight(t,i+1,true)}))).k;
  const kind=Math.random()<divProb?pick(['div','miss']):'mul';
  return build(kind,t,k);
}
function weakQ(pool,divProb){
  const items=[];
  pool.forEach(t=>{for(let k=1;k<=10;k++){const w=factWeight(t,k,false);items.push({t,k,w:w*w});}});
  const it=wpick(items),kind=Math.random()<divProb?pick(['div','miss']):'mul';
  return build(kind,it.t,it.k);
}
function mastery(){
  const keys=new Set();[2,3,4].forEach(t=>{for(let k=1;k<=10;k++)keys.add(fkey(t,k));});
  let ok=0;keys.forEach(k=>{const f=S.facts[k];if(f&&f.box>=2)ok++;});return {ok,tot:keys.size};
}
function renderVis(host,v,level,run){
  host.replaceChildren();if(!v)return;
  if(v.type==='array'){
    const wrap=h('div',{class:'arr'}),cols=[];
    for(let g=0;g<v.groups;g++){const col=h('div',{class:'acol'},Array.from({length:v.per},()=>h('span',{class:'it'},v.item)),h('b',{class:'lab'},''));wrap.append(col);cols.push(col);}
    host.append(wrap);
    if(level>=2)cols.forEach((c,i)=>setTimeout(()=>{if(!run.alive)return;c.classList.add('lit');$('.lab',c).textContent=(i+1)*v.per;sfx.pop();},380*(i+1)));
  }else if(v.type==='groups'){
    const box=h('div',{}),pile=h('div',{class:'pile'},Array.from({length:v.total},()=>h('span',{class:'it'},v.item)));box.append(pile);
    if(level>=2){const wrap=h('div',{class:'arr'});box.append(wrap);const n=v.total/v.per;
      for(let g=0;g<n;g++)setTimeout(()=>{if(!run.alive)return;wrap.append(h('div',{class:'acol lit'},Array.from({length:v.per},()=>h('span',{class:'it'},v.item)),h('b',{class:'lab'},g+1)));sfx.pop();},420*(g+1));}
    host.append(box);
  }
}
function ask(run,q,box,o){
  o=o||{};
  return new Promise(resolve=>{
    const mode=o.mode||'choice4';let tries=0,finished=false,counted=false,kval='';
    box.replaceChildren();
    const vis=h('div',{class:'vis'}),hint=h('div',{class:'hint',hidden:true}),fb=h('div',{class:'fb'}),ans=h('div',{class:'answers'});
    box.append(q.prompt?h('div',{class:'prompt'},q.prompt):null,h('div',{class:'qbig px'},q.text),vis,hint,fb,ans);
    let disp=null;
    const press=k=>{
      if(finished)return;sfx.pop();
      if(k==='⌫')kval=kval.slice(0,-1);
      else if(k==='✔'){if(kval){const v=parseInt(kval,10);kval='';disp.textContent='?';submit(v,null);return;}}
      else if(kval.length<3)kval+=k;
      disp.textContent=kval||'?';
    };
    if(mode.startsWith('choice')){
      const n=+mode.slice(6);if(n===3)ans.classList.add('three');
      optsChoice(q.ans,q.near||[],n).forEach(v=>ans.append(h('button',{class:'opt px',onclick:e=>submit(v,e.currentTarget)},v)));
    }else{
      ans.style.display='block';disp=h('div',{class:'kdisp px'},'?');
      const pad=h('div',{class:'kpad'});
      [1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].forEach(k=>pad.append(h('button',{class:'key px'+(k==='✔'?' go':''),onclick:()=>press(String(k))},k)));
      ans.append(disp,pad);
    }
    const kd=ev=>{
      if(!run.alive||finished){document.removeEventListener('keydown',kd);return;}
      if(mode==='keypad'){if(/^[0-9]$/.test(ev.key))press(ev.key);else if(ev.key==='Backspace')press('⌫');else if(ev.key==='Enter')press('✔');}
    };
    document.addEventListener('keydown',kd);
    const cleanup=()=>document.removeEventListener('keydown',kd);
    function showHint(level){
      hint.hidden=false;const txt=level===1?q.hint1:q.reveal;
      hint.replaceChildren(h('b',{},'🐶 Cubi: '),txt);
      if(S.settings.read)speak(txt);renderVis(vis,q.vis,level,run);
    }
    function submit(v,btn){
      if(finished||!run.alive)return;
      if(v===q.ans){
        finished=true;cleanup();
        if(!counted){counted=true;recordFact(q.fact[0],q.fact[1],true);}
        if(tries===0){S.gears++;save();}
        sfx.ok();if(btn)btn.classList.add('right');
        fb.textContent=pick(['¡Eso es! ✨','¡Bien ahí! 👏','¡Crack! ⚡','¡Perfecto! 🌟','¡Genial! 🚀']);fb.className='fb good';
        let extra=0;
        if(q.kind==='mul'&&tries===0&&q.a!==q.b&&!S.disc[fkey(q.a,q.b)]){
          S.disc[fkey(q.a,q.b)]=1;save();extra=700;
          fb.after(h('div',{class:'disc'},`🧠 ¡Descubrimiento! ${q.a} × ${q.b} y ${q.b} × ${q.a} dan lo mismo: ${q.ans}.`));
        }
        setTimeout(()=>{if(run.alive)resolve({errors:tries,revealed:false});},700+extra);
      }else{
        tries++;
        if(!counted){counted=true;recordFact(q.fact[0],q.fact[1],false);}
        sfx.bad();if(btn){btn.classList.add('wrong');btn.disabled=true;}
        if(tries===1){fb.textContent='¡Casi! Mirá este truco 👇';fb.className='fb meh';showHint(1);}
        else{
          finished=true;cleanup();showHint(2);fb.textContent='Ahora ya lo sabemos 💪';fb.className='fb meh';
          [...ans.querySelectorAll('.opt')].forEach(b=>{if(+b.textContent===q.ans)b.classList.add('right');});
          box.append(h('div',{class:'cb-row'},h('button',{class:'btn green',onclick:()=>resolve({errors:tries,revealed:true})},'Seguir ▶')));
        }
      }
    }
  });
}

function exportSave(){return 'CHIRI1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function importSave(txt){
  try{
    txt=String(txt).replace(/\s+/g,'');
    if(txt.indexOf('CHIRI1:')!==0)return false;
    const o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(7)))));
    if(!o||typeof o!=='object'||!o.nights||!o.facts)return false;
    const d=DEF();S=Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});save();return true;
  }catch(e){return false;}
}

function runWorkshop(M){
  const box=h('div',{class:'card'}),stat=h('div',{class:'px',style:'font-size:.6rem;color:var(--amber);margin-bottom:8px'});
  show(h('div',{},h('div',{class:'hud'},h('button',{class:'btn small ghost',onclick:screenWorkshop},'◀'),h('div',{class:'ttl px'},M.e+' '+M.n),h('span',{})),stat,box));

  (async()=>{
    const N=10,used=new Set(),missed=[];let good=0,first=0;
    for(let i=0;i<N;i++){
      let q;for(let g=0;g<10;g++){q=M.gen();if(!used.has(q.kind+q.text))break;}used.add(q.kind+q.text);
      const kp=i>=6&&first>=5&&!S.settings.forceOpts;
      stat.textContent=`Cuenta ${i+1} de ${N}`+(kp?' · ¡sin opciones!':'');

  })();
}
